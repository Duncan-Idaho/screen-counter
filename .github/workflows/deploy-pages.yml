name: Deploy to GitHub Pages

# One Pages deployment per repository: every run rebuilds BOTH channels and
# publishes them as a single artifact (main at the root, beta under /beta/).
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-src

      - name: Detect beta branch
        id: beta
        working-directory: stable-src
        run: |
          if git ls-remote --exit-code --heads origin beta > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No beta branch: deploying stable only."
          fi

      - name: Checkout beta
        if: steps.beta.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stable-src/package-lock.json

      - name: Build stable
        working-directory: stable-src
        run: |
          npm ci
          npm run build

      - name: Build beta
        if: steps.beta.outputs.exists == 'true'
        working-directory: beta-src
        env:
          APP_CHANNEL: beta
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r stable-src/dist/. site/
          if [ "${{ steps.beta.outputs.exists }}" = "true" ]; then
            mkdir -p site/beta
            cp -r beta-src/dist/. site/beta/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
